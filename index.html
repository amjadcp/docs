<!DOCTYPE html>
<html>
<head>
    <title>Notes App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css" rel="stylesheet">
    <style>
        .note-card {
            margin-bottom: 1rem;
            cursor: pointer;
        }
        .editor-container {
            display: none;
        }
        .notes-list {
            display: block;
        }
        .note-actions {
            display: flex;
            gap: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="notes-list">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>My Notes</h2>
                <button class="btn btn-primary" onclick="showEditor()">Add Note</button>
            </div>
            <div id="notesList"></div>
        </div>

        <div class="editor-container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 id="editorTitle">New Note</h2>
                <div>
                    <button class="btn btn-secondary me-2" onclick="showNotesList()">Cancel</button>
                    <button class="btn btn-primary" onclick="saveNote()">Save</button>
                </div>
            </div>
            <input type="text" id="noteTitle" class="form-control mb-3" placeholder="Note Title">
            <textarea id="editor"></textarea>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
    <script>
        let editor;
        let currentNoteId = null;

        document.addEventListener('DOMContentLoaded', function() {
            editor = new EasyMDE({
                element: document.getElementById('editor'),
                spellChecker: false
            });
            loadNotes();
        });

        async function loadNotes() {
            const notes = await pywebview.api.get_notes();
            const notesList = document.getElementById('notesList');
            notesList.innerHTML = '';
            
            notes.forEach(note => {
                const noteCard = document.createElement('div');
                noteCard.className = 'card note-card';
                noteCard.innerHTML = `
                    <div class="card-body">
                        <h5 class="card-title">${note.title}</h5>
                        <div class="note-actions">
                            <button class="btn btn-sm btn-primary" onclick="editNote(${note.id}, '${note.title}', \`${note.content}\`)">Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteNote(${note.id})">Delete</button>
                        </div>
                    </div>
                `;
                notesList.appendChild(noteCard);
            });
        }

        function showEditor() {
            document.querySelector('.notes-list').style.display = 'none';
            document.querySelector('.editor-container').style.display = 'block';
            currentNoteId = null;
            document.getElementById('noteTitle').value = '';
            editor.value('');
        }

        function showNotesList() {
            document.querySelector('.notes-list').style.display = 'block';
            document.querySelector('.editor-container').style.display = 'none';
            loadNotes();
        }

        async function saveNote() {
            const title = document.getElementById('noteTitle').value;
            const content = editor.value();
            
            if (!title || !content) {
                alert('Please enter both title and content');
                return;
            }

            if (currentNoteId) {
                await pywebview.api.update_note(currentNoteId, title, content);
            } else {
                await pywebview.api.add_note(title, content);
            }
            
            showNotesList();
        }

        function editNote(id, title, content) {
            currentNoteId = id;
            document.getElementById('noteTitle').value = title;
            editor.value(content);
            document.querySelector('.notes-list').style.display = 'none';
            document.querySelector('.editor-container').style.display = 'block';
        }

        async function deleteNote(id) {
            if (confirm('Are you sure you want to delete this note?')) {
                await pywebview.api.delete_note(id);
                loadNotes();
            }
        }
    </script>
</body>
</html>
